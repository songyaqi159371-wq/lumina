<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020617" />
    <title>Lumina Tarot - 塔罗学习与占卜</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔮</text></svg>">
    
    <script>
      const originalWarn = console.warn;
      console.warn = (...args) => {
        if (args[0] && typeof args[0] === 'string' && args[0].includes('cdn.tailwindcss.com')) return;
        originalWarn.apply(console, args);
      };
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Lato', 'sans-serif'],
            },
            colors: {
              mystic: {
                950: '#020617',
                900: '#030712', 
                800: '#0f172a', 
                700: '#1e1b4b', 
                600: '#312e81', 
                500: '#4c1d95', 
                400: '#6d28d9', 
                300: '#8b5cf6', 
                gold: '#fbbf24',
              }
            },
            animation: {
              'flip-in': 'flipIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
              'float': 'float 4s ease-in-out infinite',
              'pulse-slow': 'pulse 6s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'shimmer': 'shimmer 3s linear infinite',
              'spin-slow': 'spin 12s linear infinite',
              'star-blink': 'blink 4s ease-in-out infinite',
            },
            keyframes: {
              flipIn: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              blink: {
                '0%, 100%': { opacity: 0.3, transform: 'scale(1)' },
                '50%': { opacity: 1, transform: 'scale(1.2)' },
              }
            }
          },
        },
      }
    </script>
    <style>
      :root {
        --glass-border: rgba(255, 255, 255, 0.08);
        --glass-bg: rgba(15, 23, 42, 0.65);
      }
      body {
        background-color: #020617;
        color: #e2e8f0;
        overflow-x: hidden;
      }
      .perspective-1000 { perspective: 1000px; }
      .transform-style-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotate-y-180 { transform: rotateY(180deg); }
      
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
      }
      
      .glass-card {
        background: rgba(17, 24, 39, 0.7);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(251, 191, 36, 0.1);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .glass-card:hover {
        border-color: rgba(251, 191, 36, 0.3);
        box-shadow: 0 10px 40px -10px rgba(109, 40, 217, 0.3);
      }

      .mystic-glow {
        box-shadow: 0 0 20px -5px rgba(251, 191, 36, 0.4);
      }

      .shimmer-text {
        background: linear-gradient(90deg, #fbbf24 0%, #ffffff 50%, #fbbf24 100%);
        background-size: 200% auto;
        color: transparent;
        -webkit-background-clip: text;
        background-clip: text;
        animation: shimmer 5s linear infinite;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #312e81; border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: #fbbf24; }

      /* Star Background */
      .bg-stars {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 10%, #1e1b4b 0%, #020617 80%);
        z-index: -1;
      }
      .star {
        position: absolute;
        background: white;
        border-radius: 50%;
        filter: blur(1px);
        animation: star-blink infinite;
      }
    </style>
</head>
  <body>
    <div class="bg-stars" id="stars-container"></div>
    <div id="root"></div>
    <script>
      // Generate some random stars
      const container = document.getElementById('stars-container');
      for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.width = Math.random() * 3 + 'px';
        star.style.height = star.style.width;
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDuration = (Math.random() * 3 + 2) + 's';
        star.style.animationDelay = (Math.random() * 5) + 's';
        container.appendChild(star);
      }
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
