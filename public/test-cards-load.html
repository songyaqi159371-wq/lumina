<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>塔罗牌图片加载测试</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: system-ui;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #fbbf24;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            aspect-ratio: 3/5;
            background: #1e293b;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #334155;
            position: relative;
        }
        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .card.error {
            border-color: red;
        }
        .card.loaded {
            border-color: #10b981;
        }
        .card .label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.8);
            padding: 5px;
            font-size: 11px;
            text-align: center;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 塔罗牌图片加载测试</h1>
        <p>测试所有78张塔罗牌图片是否能正常加载</p>

        <div class="stats">
            <div>✅ 加载成功: <span id="loaded">0</span></div>
            <div>❌ 加载失败: <span id="failed">0</span></div>
            <div>⏳ 加载中: <span id="loading">78</span></div>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <script>
        const stats = {
            loaded: 0,
            failed: 0,
            loading: 78
        };

        function updateStats() {
            document.getElementById('loaded').textContent = stats.loaded;
            document.getElementById('failed').textContent = stats.failed;
            document.getElementById('loading').textContent = stats.loading;
        }

        function getCardImageUrl(id) {
            const pad = (n) => n.toString().padStart(2, '0');
            const getSuffix = (n) => {
                if (n === 1) return 'ac';
                if (n === 11) return 'pa';
                if (n === 12) return 'kn';
                if (n === 13) return 'qu';
                if (n === 14) return 'ki';
                return pad(n);
            };

            if (id <= 21) {
                return `/cards/ar${pad(id)}.jpg`;
            } else if (id >= 22 && id <= 35) {
                return `/cards/wa${getSuffix(id - 21)}.jpg`;
            } else if (id >= 36 && id <= 49) {
                return `/cards/cu${getSuffix(id - 35)}.jpg`;
            } else if (id >= 50 && id <= 63) {
                return `/cards/sw${getSuffix(id - 49)}.jpg`;
            } else if (id >= 64 && id <= 77) {
                return `/cards/pe${getSuffix(id - 63)}.jpg`;
            }
            return '';
        }

        const grid = document.getElementById('grid');

        // 生成78张卡片
        for (let id = 0; id <= 77; id++) {
            const cardDiv = document.createElement('div');
            cardDiv.className = 'card';

            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = '⏳';
            cardDiv.appendChild(loadingDiv);

            const img = document.createElement('img');
            const url = getCardImageUrl(id);
            img.src = url;
            img.loading = 'lazy';

            img.onload = () => {
                stats.loaded++;
                stats.loading--;
                cardDiv.classList.add('loaded');
                loadingDiv.remove();
                updateStats();
                console.log(`✅ Loaded: ${url}`);
            };

            img.onerror = () => {
                stats.failed++;
                stats.loading--;
                cardDiv.classList.add('error');
                loadingDiv.textContent = '❌';
                loadingDiv.style.color = 'red';
                updateStats();
                console.error(`❌ Failed: ${url}`);
            };

            cardDiv.appendChild(img);

            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = `ID: ${id}`;
            cardDiv.appendChild(label);

            grid.appendChild(cardDiv);
        }
    </script>
</body>
</html>
