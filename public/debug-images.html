<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片加载详细测试</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #0a0a0a;
            color: #fff;
        }
        .stats {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            border: 2px solid #333;
        }
        .card {
            display: inline-block;
            margin: 5px;
            text-align: center;
            width: 80px;
        }
        img {
            width: 80px;
            height: 120px;
            border: 2px solid #333;
            object-fit: cover;
            background: #222;
        }
        .success { border-color: #0f0 !important; }
        .error { border-color: #f00 !important; }
        .filename { font-size: 10px; margin-top: 5px; }
        .status { font-size: 9px; color: #888; }
        h1 { color: #fbbf24; }
        .log {
            margin-top: 20px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 11px;
        }
        .error-msg { color: #f00; }
        .success-msg { color: #0f0; }
    </style>
</head>
<body>
    <h1>🔮 Lumina Tarot - 图片加载测试</h1>

    <div class="stats">
        <div>✅ 成功: <span id="loaded">0</span></div>
        <div>❌ 失败: <span id="failed">0</span></div>
        <div>⏳ 总计: <span id="total">0</span></div>
        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #333;">
            <div style="font-size: 11px;">成功率: <span id="rate">0%</span></div>
        </div>
    </div>

    <div id="results"></div>
    <div class="log" id="log"></div>

    <script>
        const results = document.getElementById('results');
        const logEl = document.getElementById('log');

        // 所有78张牌
        const allCards = [
            // Major Arcana
            ...Array.from({length: 22}, (_, i) => `ar${String(i).padStart(2, '0')}.jpg`),
            // Wands
            'waac.jpg', 'wa02.jpg', 'wa03.jpg', 'wa04.jpg', 'wa05.jpg', 'wa06.jpg',
            'wa07.jpg', 'wa08.jpg', 'wa09.jpg', 'wa10.jpg', 'wapa.jpg', 'wakn.jpg', 'waqu.jpg', 'waki.jpg',
            // Cups
            'cuac.jpg', 'cu02.jpg', 'cu03.jpg', 'cu04.jpg', 'cu05.jpg', 'cu06.jpg',
            'cu07.jpg', 'cu08.jpg', 'cu09.jpg', 'cu10.jpg', 'cupa.jpg', 'cukn.jpg', 'cuqu.jpg', 'cuki.jpg',
            // Swords
            'swac.jpg', 'sw02.jpg', 'sw03.jpg', 'sw04.jpg', 'sw05.jpg', 'sw06.jpg',
            'sw07.jpg', 'sw08.jpg', 'sw09.jpg', 'sw10.jpg', 'swpa.jpg', 'swkn.jpg', 'swqu.jpg', 'swki.jpg',
            // Pentacles
            'peac.jpg', 'pe02.jpg', 'pe03.jpg', 'pe04.jpg', 'pe05.jpg', 'pe06.jpg',
            'pe07.jpg', 'pe08.jpg', 'pe09.jpg', 'pe10.jpg', 'pepa.jpg', 'pekn.jpg', 'pequ.jpg', 'peki.jpg'
        ];

        let loaded = 0;
        let failed = 0;
        const failedList = [];

        function log(msg, isError = false) {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = isError ? 'error-msg' : 'success-msg';
            div.textContent = `[${time}] ${msg}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function updateStats() {
            document.getElementById('loaded').textContent = loaded;
            document.getElementById('failed').textContent = failed;
            document.getElementById('total').textContent = allCards.length;
            const rate = ((loaded / allCards.length) * 100).toFixed(1);
            document.getElementById('rate').textContent = rate + '%';
            document.title = `✓${loaded} ✗${failed}/${allCards.length} - 图片测试`;
        }

        // 测试所有卡牌，带延迟
        allCards.forEach((filename, index) => {
            setTimeout(() => {
                const div = document.createElement('div');
                div.className = 'card';

                const img = document.createElement('img');
                img.src = `/cards/${filename}`;

                img.onload = () => {
                    img.className = 'success';
                    loaded++;
                    updateStats();
                    log(`✓ ${filename}`);
                };

                img.onerror = () => {
                    img.className = 'error';
                    img.alt = '❌';
                    failed++;
                    failedList.push(filename);
                    updateStats();
                    log(`✗ ${filename} - 加载失败`, true);
                };

                const label = document.createElement('div');
                label.className = 'filename';
                label.textContent = filename;

                const status = document.createElement('div');
                status.className = 'status';
                status.textContent = '加载中...';

                div.appendChild(img);
                div.appendChild(label);
                div.appendChild(status);
                results.appendChild(div);
            }, index * 100); // 每张图片间隔100ms
        });

        updateStats();
        log('开始测试 78 张塔罗牌图片...');
    </script>
</body>
</html>
