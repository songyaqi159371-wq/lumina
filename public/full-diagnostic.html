<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Tarot - 完整诊断</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            padding: 20px;
            line-height: 1.6;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #fbbf24; margin-bottom: 10px; }
        h2 { color: #60a5fa; margin: 30px 0 15px; border-bottom: 2px solid #333; padding-bottom: 10px; }
        .info-box {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin: 15px 0;
        }
        .info-box strong { color: #fbbf24; }
        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .card-item {
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 10px;
            transition: all 0.3s;
        }
        .card-item.success { border-color: #22c55e; }
        .card-item.error { border-color: #ef4444; }
        .card-item img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            background: #000;
        }
        .status {
            margin-top: 8px;
            font-size: 11px;
            padding: 5px;
            border-radius: 4px;
            text-align: center;
        }
        .status.loading { background: #854d0e; color: #fbbf24; }
        .status.success { background: #14532d; color: #22c55e; }
        .status.error { background: #450a0a; color: #ef4444; }
        .url { font-size: 10px; color: #666; word-break: break-all; margin-top: 5px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
        }
        .stat-number {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label { color: #999; font-size: 12px; text-transform: uppercase; }
        button {
            background: #fbbf24;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        button:hover { background: #f59e0b; transform: translateY(-2px); }
        .console {
            background: #000;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }
        .console-line { padding: 2px 0; }
        .console-error { color: #ef4444; }
        .console-success { color: #22c55e; }
        .console-info { color: #60a5fa; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Lumina Tarot - 完整系统诊断</h1>
        <p style="color: #666; margin-bottom: 20px;">全面测试图片加载、网络请求和页面渲染</p>

        <div class="info-box">
            <strong>当前环境:</strong><br>
            URL: <span id="currentUrl"></span><br>
            User Agent: <span id="userAgent"></span><br>
            时间: <span id="currentTime"></span>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">总测试数</div>
                <div class="stat-number" id="totalTests">0</div>
            </div>
            <div class="stat-card" style="border-color: #22c55e;">
                <div class="stat-label">成功</div>
                <div class="stat-number" style="color: #22c55e;" id="successCount">0</div>
            </div>
            <div class="stat-card" style="border-color: #ef4444;">
                <div class="stat-label">失败</div>
                <div class="stat-number" style="color: #ef4444;" id="errorCount">0</div>
            </div>
            <div class="stat-card" style="border-color: #fbbf24;">
                <div class="stat-label">平均加载时间</div>
                <div class="stat-number" style="color: #fbbf24; font-size: 24px;" id="avgTime">-</div>
            </div>
        </div>

        <div>
            <button onclick="runAllTests()">🚀 运行全部测试</button>
            <button onclick="clearConsole()">🗑️ 清空日志</button>
            <button onclick="testProduction()">🌐 测试线上环境</button>
        </div>

        <h2>📊 实时日志</h2>
        <div class="console" id="console"></div>

        <h2>🖼️ 图片加载测试</h2>
        <div class="test-grid" id="testGrid"></div>
    </div>

    <script>
        // 基本信息
        document.getElementById('currentUrl').textContent = window.location.href;
        document.getElementById('userAgent').textContent = navigator.userAgent;
        document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');

        const testImages = [
            '/cards/ar00.jpg', '/cards/ar01.jpg', '/cards/ar05.jpg', '/cards/ar10.jpg',
            '/cards/ar15.jpg', '/cards/ar20.jpg', '/cards/ar21.jpg',
            '/cards/waac.jpg', '/cards/wa02.jpg', '/cards/wa05.jpg',
            '/cards/cuac.jpg', '/cards/cu02.jpg',
            '/cards/swac.jpg', '/cards/sw02.jpg',
            '/cards/peac.jpg', '/cards/pe02.jpg'
        ];

        let successCount = 0;
        let errorCount = 0;
        let loadTimes = [];

        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line console-${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
            console.log(message);
        }

        function updateStats() {
            document.getElementById('totalTests').textContent = testImages.length;
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('errorCount').textContent = errorCount;
            if (loadTimes.length > 0) {
                const avg = loadTimes.reduce((a, b) => a + b, 0) / loadTimes.length;
                document.getElementById('avgTime').textContent = avg.toFixed(0) + 'ms';
            }
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            log('日志已清空', 'info');
        }

        async function testProduction() {
            log('开始测试线上环境...', 'info');
            const prodUrl = 'https://lumina-4yc.pages.dev/cards/ar00.jpg';

            try {
                const response = await fetch(prodUrl, { method: 'HEAD' });
                log(`✓ 线上图片可访问: ${response.status} ${response.statusText}`, 'success');
                log(`  Content-Type: ${response.headers.get('content-type')}`, 'info');
                log(`  Content-Length: ${response.headers.get('content-length')} bytes`, 'info');
            } catch (error) {
                log(`✗ 线上图片访问失败: ${error.message}`, 'error');
            }
        }

        function runAllTests() {
            log('======== 开始全面测试 ========', 'info');
            successCount = 0;
            errorCount = 0;
            loadTimes = [];

            const grid = document.getElementById('testGrid');
            grid.innerHTML = '';

            testImages.forEach((url, index) => {
                const item = document.createElement('div');
                item.className = 'card-item';

                const img = document.createElement('img');
                const status = document.createElement('div');
                status.className = 'status loading';
                status.textContent = '⏳ 加载中...';

                const urlDiv = document.createElement('div');
                urlDiv.className = 'url';
                urlDiv.textContent = url;

                const startTime = performance.now();

                img.onload = () => {
                    const loadTime = performance.now() - startTime;
                    loadTimes.push(loadTime);
                    successCount++;
                    item.className = 'card-item success';
                    status.className = 'status success';
                    status.innerHTML = `✓ ${loadTime.toFixed(0)}ms<br>${img.naturalWidth}×${img.naturalHeight}`;
                    log(`✓ 成功: ${url} (${loadTime.toFixed(0)}ms)`, 'success');
                    updateStats();
                };

                img.onerror = (e) => {
                    errorCount++;
                    item.className = 'card-item error';
                    status.className = 'status error';
                    status.textContent = '✗ 加载失败';
                    log(`✗ 失败: ${url}`, 'error');
                    updateStats();
                };

                img.src = url;
                img.alt = url;

                item.appendChild(img);
                item.appendChild(status);
                item.appendChild(urlDiv);
                grid.appendChild(item);
            });

            updateStats();
        }

        // 自动运行测试
        log('页面加载完成，准备运行测试...', 'info');
        setTimeout(() => runAllTests(), 500);
    </script>
</body>
</html>
